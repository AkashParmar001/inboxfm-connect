events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Conservative per-IP limit for the public gateway. Sustained traffic above
    # the rate is rejected with 429; the burst window absorbs a cold page load.
    limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=10r/s;
    limit_req_status 429;

    # Upstream status and timing make gateway-level failures diagnosable.
    # Deliberately excludes Authorization, cookies, and request bodies.
    log_format gateway '$remote_addr - [$time_local] "$request" '
                       '$status body_bytes_sent="$body_bytes_sent" '
                       'upstream_status="$upstream_status" '
                       'request_time=$request_time host="$host" '
                       'referer="$http_referer" agent="$http_user_agent"';

    access_log /var/log/nginx/access.log gateway;

    upstream inboxfm_app {
        server app:80;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50m;
        client_header_buffer_size 4k;
        large_client_header_buffers 4 8k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Served locally, never proxied, and intentionally outside limit_req.
        location = /_gateway/health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=gateway_limit burst=30 nodelay;

            proxy_pass http://inboxfm_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
